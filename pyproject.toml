[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pa-booking-service"
version = "0.1.0"
description = "Записи к психологу/МКР и библиотека (Личный Кабинет Оператора)"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "structlog>=24.1,<27",
    "prometheus-client>=0.20,<1",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13,<2",
    "psycopg[binary]>=3.1,<4",
    "httpx>=0.27,<1",
    "celery>=5.4,<6",
    "celery-redbeat>=2.2,<3",
    "redis>=5.0,<8",
    "pyjwt>=2.8,<3",
    "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10",
    "ruff>=0.4,<1",
    "mypy>=1.10,<3",
    "testcontainers[postgres]>=4.0,<5",
    "types-openpyxl>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --strict-markers -m 'not external and not db'"
pythonpath = ["src"]
filterwarnings = ["error::DeprecationWarning"]
markers = [
    "external: tests that hit real external APIs (skipped by default)",
    "db: integration tests requiring Postgres via testcontainers (skipped by default)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# Блоки кода в docs/*.md (планы, спеки) — иллюстрации, не форматируем.
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["pa_booking"]

[[tool.mypy.overrides]]
module = ["celery.*", "redbeat.*", "testcontainers.*"]
ignore_missing_imports = true
